<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0e1216" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">

  <!-- Apply a stored theme before first paint; otherwise follow the system. -->
  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add('js');
      try {
        var theme = localStorage.getItem('theme');
        if (theme === 'light' || theme === 'dark') root.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>

  <!-- Title, description, canonical, Open Graph, Twitter, base JSON-LD -->
  {% seo %}
  <meta name="keywords" content="{{ site.data.site.keywords }}">

  {% if page.layout == 'home' %}{% include structured-data.html %}{% endif %}

  {% if site.favicon %}
  <link rel="icon" type="image/x-icon" href="{{ site.favicon | relative_url }}">
  {% endif %}

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
