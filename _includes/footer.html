<!-- Site footer: identity, privacy note, and verified profile links. -->
<footer class="site-footer">
  <div class="container site-footer__inner">
    <div>
      <p>&copy; {{ site.time | date: "%Y" }} {{ site.data.profile.name }}</p>
      <p>{{ site.data.site.footer.note }}</p>
    </div>
    <ul class="site-footer__links">
      {% if site.data.profile.social.github %}
      <li><a href="https://github.com/{{ site.data.profile.social.github }}" rel="noopener">GitHub <span aria-hidden="true">↗</span></a></li>
      {% endif %}
      {% if site.data.profile.social.linkedin %}
      <li><a href="https://www.linkedin.com/in/{{ site.data.profile.social.linkedin }}" rel="noopener">LinkedIn <span aria-hidden="true">↗</span></a></li>
      {% endif %}
      <li><a href="{{ '/resume/' | relative_url }}">Résumé</a></li>
      <li><a href="#main">Back to top</a></li>
    </ul>
  </div>
</footer>
