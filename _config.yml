# Site Settings
title: Elvis Nuno
tagline: Infrastructure & Systems Engineer
description: Elvis Nuno is an infrastructure and systems engineer and open-source maintainer. He builds governed AI-agent tooling on two decades of ISP, datacenter, Linux, and automation work.
author: Elvis Nuno
lang: en_US
twitter:
  username: NunoElvis
  card: summary
url: https://enuno.github.io
baseurl: /DynamicCareerCanvas
repository: enuno/DynamicCareerCanvas

# Site Configuration
version: 2
favicon: images/favicon.ico
darkmode: true

# Build Settings
markdown: kramdown
permalink: pretty

# SASS/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Plugins
plugins:
  - jekyll-seo-tag

# Include/Exclude
include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - lib/
  - scripts/
  - tests/
  - .bundle/
  - .git/
  - .gitignore
  - .ai/
  - docs/
  - AGENTS.md
  - CLAUDE.md
  - CURSOR.md
  - COPILOT.md
  - GEMINI.md
  - CLINERULES.md
  - WINDSURF.md
  - CODEX.md
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - CODE_DEVELOPMENT_PLAN.md
  - DEVELOPMENT_PLAN.md
  - DESIGNSYSTEM.md
  - SECURITY.md

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
