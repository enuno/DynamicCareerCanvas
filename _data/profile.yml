# About Section
about:
  title: "About"
  bio: |
    I started in 2006 on the shift desk of Clearwire's network operations center, which ran a nationwide wireless network. I spent the next decade running Linux fleets and building automation at Clearwire, Salesforce, CDK Global, McGraw-Hill Education, and goMoxie.

    From 2019 to 2024 I co-founded and ran the Pacific NW Rural Broadband Alliance, a non-profit that engineered community-owned ISPs in rural Montana. I then directed network operations through an ISP merger at Centric Internet Services.

    Today I design fiber WAN and datacenter networking at ServerDomes. I founded Ryno Crypto Services to develop modular, direct-to-chip liquid-cooled Bitcoin mining infrastructure powered by green energy. I also build open-source tools for AI agents that operate infrastructure.

# Engineering principles (About section)
principles:
  - name: "Reproducible"
    text: "If a system cannot be rebuilt from code and inventory, it is not finished. Configuration lives in Ansible, Terraform, and Helm, not in shell history."
  - name: "Observable"
    text: "Services expose metrics, health checks, and structured logs. An operator should not have to guess the current state of a system."
  - name: "Least privilege"
    text: "People and agents get the narrowest access that does the job. Risky actions need explicit confirmation, a dry run, or a human approval gate."
  - name: "Maintainable"
    text: "Plain tools, small modules, written conventions, and tests that run in CI. The next maintainer should not need me in the room."
  - name: "Private by default"
    text: "Self-host where it is practical and keep services local-first. This site has no analytics, trackers, or cookies."
  - name: "Evidence over claims"
    text: "A passing test suite is not a deployment, and a star count is not adoption. Report each status at the layer where it was verified."

