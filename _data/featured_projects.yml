      label: "View repository"
      url: "https://github.com/enuno/noesis-ansible"
    secondary:
      - label: "Browse the roles"
        url: "https://github.com/enuno/noesis-ansible/tree/main/roles"
  related:
    - "noesis-agent-stack"
  checked: "2026-10-15"
