# Editorial content only. GitHub metrics (stars, forks, releases) live in
# _data/github_metrics.json, a generated snapshot. See docs/CONTENT.md.
#
# Schema (one entry per project, flagship first):
#   slug          "kebab-case" id, unique; anchor is #project-<slug>
#   name          display name
#   subtitle      optional secondary name (for example, repository branding)
#   repo          "owner/name"; key used to look up github_metrics.json
