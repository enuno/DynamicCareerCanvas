#   flagship      true for the lead project (one entry only)
#   logo          optional { src, width, height } path under assets/
#   status        { label, note } verified status, with the date it was checked
#   summary       one sentence: what it is
#   problem       what problem it solves
#   approach      what was built
#   highlights    list of verified, distinctive points
#   safety        optional list of safety controls
#   community     optional paragraph about outside participation
#   flow          optional list of { step, detail, gate } for a conceptual
#                 diagram; gate: true marks a review or approval checkpoint
#   distinction   optional note on how claims are separated by layer
